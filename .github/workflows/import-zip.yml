name: Import update zip
# Upload a quickmessage-callNN.zip into the incoming/ folder of the repo (GitHub → Add file → Upload files).
# This workflow unzips it over the project, commits the changed files, removes the zip and starts the Android / iOS builds when their folders changed.
on:
  push:
    paths: ["incoming/*.zip"]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: import-zip
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    env:
      # Optional secret WORKFLOW_PAT (a personal access token with "repo" + "workflow" scopes). Without it GitHub refuses changes to
      # .github/workflows/, so those files are skipped; with it they are updated and the pushes trigger the builds themselves.
      HAS_PAT: ${{ secrets.WORKFLOW_PAT != '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_PAT || github.token }}
          fetch-depth: 2
      - name: Unpack the newest zip and commit
        run: |
          set -e
          shopt -s nullglob
          zips=(incoming/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then echo "No zip in incoming/ - nothing to do."; exit 0; fi
          newest=$(printf '%s\n' "${zips[@]}" | sort -V | tail -n1)
          echo "Importing $newest"
          rm -rf "$RUNNER_TEMP/unz" && mkdir "$RUNNER_TEMP/unz"
          unzip -q "$newest" -d "$RUNNER_TEMP/unz"
          src="$RUNNER_TEMP/unz"
          # a zip made as one top-level folder: use what is inside it
          if [ ! -e "$src/index.html" ] && [ "$(ls -1 "$src" | wc -l)" -eq 1 ] && [ -d "$src/$(ls -1 "$src")" ]; then src="$src/$(ls -1 "$src")"; fi
          if [ ! -e "$src/index.html" ]; then echo "::error::The zip doesn't look like a QuickMessage project (no index.html)."; exit 1; fi
          excludes=(--exclude=/.git/ --exclude=/incoming/ --exclude='*.zip' --exclude=/secrets.php)       # secrets.php holds the Firebase private key: it is never committed
          if [ "$HAS_PAT" != "true" ]; then excludes+=(--exclude=/.github/); echo "::notice::No WORKFLOW_PAT secret: .github/ is left as it is."; fi
          rsync -a "${excludes[@]}" "$src"/ ./
          rm -f incoming/*.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git diff --cached --name-only > "$RUNNER_TEMP/changed.txt"
          git commit -q -m "Import $(basename "$newest")"
          git push
          if [ "$HAS_PAT" != "true" ]; then       # pushes made with the built-in token don't start other workflows, so start the builds by hand
            if grep -q '^android/' "$RUNNER_TEMP/changed.txt"; then gh workflow run build-android.yml --ref "${GITHUB_REF_NAME}"; fi
            if grep -q '^ios/' "$RUNNER_TEMP/changed.txt"; then gh workflow run build-ios.yml --ref "${GITHUB_REF_NAME}"; fi
            if grep -qv -e '^android/' -e '^ios/' -e '^\.github/' -e '^README' "$RUNNER_TEMP/changed.txt"; then gh workflow run deploy-ftp.yml --ref "${GITHUB_REF_NAME}" -f what=site; fi
          fi
