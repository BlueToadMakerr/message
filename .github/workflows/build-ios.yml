name: Build iOS app
# Builds an UNSIGNED .ipa (no Apple developer account needed). Sign it yourself to install it: Sideloadly, AltStore, or Xcode with your Apple ID.
# Also builds a .tipa for TrollStore (same app, fake-signed with ldid; TrollStore installs it permanently, no signing or 7-day expiry).
on:
  push:
    paths: ["ios/**", ".github/workflows/build-ios.yml"]
  workflow_dispatch:
jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project QuickMessage.xcodeproj -scheme QuickMessage \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=$((100 + GITHUB_RUN_NUMBER)) MARKETING_VERSION=1.0.$GITHUB_RUN_NUMBER \
            build
      - name: Package the .ipa
        working-directory: ios
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/QuickMessage.app Payload/
          zip -qr QuickMessage-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: quickmessage-ios-unsigned
          path: ios/QuickMessage-unsigned.ipa
      # TrollStore: a .tipa is an .ipa whose binaries carry a fake signature (ldid) — TrollStore replaces it with its own permanent one.
      - name: Package the .tipa (TrollStore)
        working-directory: ios
        run: |
          brew install ldid
          rm -rf tipa && mkdir -p tipa/Payload
          cp -R build/Build/Products/Release-iphoneos/QuickMessage.app tipa/Payload/
          app=tipa/Payload/QuickMessage.app
          for b in "$app"/PlugIns/*.appex; do [ -d "$b" ] && ldid -S "$b/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$b/Info.plist")"; done
          ldid -S "$app/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          (cd tipa && zip -qry ../QuickMessage.tipa Payload)
          ls -la QuickMessage.tipa
      - uses: actions/upload-artifact@v4
        with:
          name: quickmessage-ios-tipa
          path: ios/QuickMessage.tipa
      # Simulator build: runs in the iOS Simulator on a Mac (no signing, no Apple account). Boot a simulator, then:
      #   xcrun simctl install booted QuickMessage.app && xcrun simctl launch booted app.quickmessage.chat
      # Installing again over an existing copy simply updates it.
      - name: Build for the iOS Simulator
        working-directory: ios
        run: |
          xcodebuild -project QuickMessage.xcodeproj -scheme QuickMessage \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=$((100 + GITHUB_RUN_NUMBER)) MARKETING_VERSION=1.0.$GITHUB_RUN_NUMBER \
            build
          mkdir -p sim && cp -R build-sim/Build/Products/Debug-iphonesimulator/QuickMessage.app sim/
          ditto -c -k --keepParent sim/QuickMessage.app QuickMessage-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: quickmessage-ios-simulator
          path: ios/QuickMessage-simulator.zip
