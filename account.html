<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Account · QuickMessage</title>
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'system'; } catch (e) {}</script>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a href="index.html" class="icon-btn" aria-label="Back to chats" data-icon="back"></a>
    <h1 class="brand">Account</h1>
  </header>

  <main>
    <div id="loading" class="center-note">Loading…</div>

    <div id="content" class="hidden">
      <section class="card">
        <div class="profile-head">
          <span id="headAvatar"></span>
          <div class="grow">
            <div id="headName" style="font-weight:700;font-size:1.1rem"></div>
            <div id="headEmail" class="muted" style="word-break:break-all"></div>
          </div>
        </div>
        <label class="lbl">Your UID <span style="font-weight:400">— share this so people can start a chat with you</span></label>
        <div class="uid-box"><span id="uidText"></span>
          <button id="copyUidBtn" class="icon-btn" type="button" aria-label="Copy UID" data-icon="copy" data-size="18"></button>
        </div>
      </section>

      <section class="card">
        <h2>Profile</h2>
        <form id="profileForm" class="stack">
          <div>
            <label class="lbl" for="displayName">Display name</label>
            <input id="displayName" class="field" maxlength="40" placeholder="How others see you" required>
          </div>
          <div>
            <label class="lbl" for="pfpUrl">Profile picture URL</label>
            <input id="pfpUrl" class="field" type="url" placeholder="https://… (optional)">
          </div>
          <div>
            <label class="lbl" for="themeSelect">Appearance</label>
            <select id="themeSelect" class="field">
              <option value="system">Match my device</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </div>
          <button id="saveSettingsBtn" class="btn primary" type="submit">Save changes</button>
        </form>
      </section>

      <section id="passwordSection" class="card hidden">
        <h2>Password</h2>
        <form id="passwordForm" class="stack">
          <input id="oldPassword" class="field" type="password" autocomplete="current-password" placeholder="Current password" required>
          <input id="newPassword" class="field" type="password" autocomplete="new-password" placeholder="New password (6+ characters)" minlength="6" required>
          <div class="row wrap">
            <button id="changePassBtn" class="btn primary" type="submit">Change password</button>
            <button id="resetBtn" class="btn" type="button">Email me a reset link</button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2>Session</h2>
        <button id="logoutBtn" class="btn" type="button">Log out</button>
      </section>

      <section class="card danger-zone">
        <h2>Danger zone</h2>
        <p class="muted" style="margin-top:0">Deleting your account is permanent. You'll be removed from your chats; messages you've already sent stay in them.</p>
        <button id="deleteBtn" class="btn danger" type="button">Delete account</button>
      </section>
    </div>
  </main>
</div>

<script type="module" src="js/account.js"></script>
</body>
</html>
