name: Deploy to FTP
# Uploads the website, and the newest Android APK + iOS .ipa / Simulator zip, to your hosting over FTP.
# Repository secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_DIR (folder of the site on the server, e.g. /htdocs/message/).
# Optional: FTP_PROTOCOL (ftp | ftps | ftps-legacy, default ftp), FTP_PORT (default 21).
# secrets.php is never uploaded (it isn't in the repo): keep the copy that is already on your server.
on:
  push:
    branches: [main, master]
    paths-ignore: ["android/**", "ios/**", "incoming/**", "README.md", ".github/workflows/build-*.yml", ".github/workflows/import-zip.yml"]
  workflow_run:
    workflows: ["Build Android app", "Build iOS app"]
    types: [completed]
  workflow_dispatch:
    inputs:
      what:
        description: "What to upload"
        type: choice
        default: all
        options: [all, site, android, ios]
permissions:
  contents: read
  actions: read
concurrency:
  group: ftp-deploy
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
  FTP_DIR_RAW: ${{ secrets.FTP_DIR }}
jobs:
  site:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.what == 'all' || inputs.what == 'site'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Server folder
        id: d
        run: d="${FTP_DIR_RAW:-./}"; case "$d" in */) ;; *) d="$d/";; esac; echo "dir=$d" >> "$GITHUB_OUTPUT"
      - name: Upload the site
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          port: ${{ secrets.FTP_PORT || '21' }}
          server-dir: ${{ steps.d.outputs.dir }}
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            android/**
            ios/**
            incoming/**
            **/*.zip
            README.md
            database.rules.json
            secrets.php

  android:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Build Android app' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && (inputs.what == 'all' || inputs.what == 'android'))
    runs-on: ubuntu-latest
    steps:
      - name: Find the build
        id: run
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then id="${{ github.event.workflow_run.id }}"
          else id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-android.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId'); fi
          [ -n "$id" ] || { echo "::error::No successful Android build yet. Run 'Build Android app' first."; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "num=$(gh run view "$id" --repo "$GITHUB_REPOSITORY" --json number --jq .number)" >> "$GITHUB_OUTPUT"
          d="${FTP_DIR_RAW:-./}"; case "$d" in */) ;; *) d="$d/";; esac; echo "dir=$d" >> "$GITHUB_OUTPUT"
      - name: Download the APK
        run: mkdir dl && gh run download "${{ steps.run.outputs.id }}" --repo "$GITHUB_REPOSITORY" -n quickmessage-debug -D dl
      - name: Version file
        run: |
          num="${{ steps.run.outputs.num }}"
          mv dl/app-debug.apk dl/quickmessage.apk
          jq -n --argjson code "$((100 + num))" --arg name "1.0.$num" --argjson size "$(stat -c%s dl/quickmessage.apk)" --arg built "$(date -u +%FT%TZ)" \
            '{versionCode:$code, versionName:$name, url:"downloads/quickmessage.apk", size:$size, built:$built}' > dl/android.json
          printf 'AddType application/vnd.android.package-archive .apk\nAddType application/octet-stream .ipa\n' > dl/.htaccess
          cat dl/android.json
      - name: Upload to the server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          port: ${{ secrets.FTP_PORT || '21' }}
          server-dir: ${{ steps.run.outputs.dir }}downloads/
          local-dir: dl/
          state-name: .ftp-state-android.json

  ios:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Build iOS app' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && (inputs.what == 'all' || inputs.what == 'ios'))
    runs-on: ubuntu-latest
    steps:
      - name: Find the build
        id: run
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then id="${{ github.event.workflow_run.id }}"
          else id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-ios.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId'); fi
          [ -n "$id" ] || { echo "::error::No successful iOS build yet. Run 'Build iOS app' first."; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "num=$(gh run view "$id" --repo "$GITHUB_REPOSITORY" --json number --jq .number)" >> "$GITHUB_OUTPUT"
          d="${FTP_DIR_RAW:-./}"; case "$d" in */) ;; *) d="$d/";; esac; echo "dir=$d" >> "$GITHUB_OUTPUT"
      - name: Download the iOS files
        run: |
          mkdir dl
          gh run download "${{ steps.run.outputs.id }}" --repo "$GITHUB_REPOSITORY" -n quickmessage-ios-unsigned -D dl
          gh run download "${{ steps.run.outputs.id }}" --repo "$GITHUB_REPOSITORY" -n quickmessage-ios-simulator -D dl
      - name: Version file
        run: |
          num="${{ steps.run.outputs.num }}"
          jq -n --argjson code "$((100 + num))" --arg name "1.0.$num" --arg built "$(date -u +%FT%TZ)" \
            '{versionCode:$code, versionName:$name, url:"downloads/QuickMessage-unsigned.ipa", simulator:"downloads/QuickMessage-simulator.zip", built:$built}' > dl/ios.json
          printf 'AddType application/vnd.android.package-archive .apk\nAddType application/octet-stream .ipa\n' > dl/.htaccess
          ls -la dl; cat dl/ios.json
      - name: Upload to the server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          port: ${{ secrets.FTP_PORT || '21' }}
          server-dir: ${{ steps.run.outputs.dir }}downloads/
          local-dir: dl/
          state-name: .ftp-state-ios.json
