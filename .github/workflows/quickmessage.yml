name: QuickMessage
# ONE workflow for everything. It looks at what happened and runs only the parts that are needed:
#
#   prepare (what changed? unpack an uploaded zip) ─┬─► site  (website → FTP)  ──────────────┐
#                                                    ├─► android (APK) ─────────────────────────┼─► publish (APK / iOS files → FTP)
#                                                    ├─► ios (.ipa + .tipa) ────────────────────┤
#                                                    └─► ios-sim (simulator build, in parallel) ┘
#
#  • Upload a quickmessage-callNN.zip into incoming/ (GitHub → Add file → Upload files): it is unpacked over the project and committed, then
#    the parts that changed are built / uploaded: Android build if android/ changed, iOS build if ios/ changed, website upload if anything else changed.
#  • Any other push changes only what it touched the same way (an edit to the website uploads the website, an edit in android/ builds the APK, …).
#  • "Run workflow" by hand: choose what to do (everything / import / website / Android / iOS).
#
# Repository secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_DIR (folder of the site on the server, e.g. /htdocs/message/); optional FTP_PROTOCOL
# (ftp | ftps | ftps-legacy, default ftp), FTP_PORT (default 21). Without them the builds still run (downloadable as artifacts) and the upload is skipped.
# Optional signing secrets: ANDROID_KEYSTORE_B64, ANDROID_STORE_PASS, ANDROID_KEY_ALIAS, ANDROID_KEY_PASS.
# Optional WORKFLOW_PAT (personal access token with "repo" + "workflow"): lets the import also update files in .github/workflows/.
# secrets.php is never in the repo and never uploaded: keep the copy that is already on your server.
on:
  push:
    branches: [main, master]
    paths-ignore: ["README.md"]
  workflow_dispatch:
    inputs:
      what:
        description: "What to run"
        type: choice
        default: all
        options: [all, import, site, android, ios]
permissions:
  contents: write
  actions: read
concurrency:
  group: quickmessage
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}

jobs:
  # ------------------------------------------------------------------ what happened? (and unpack an uploaded zip)
  prepare:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.p.outputs.site == 'true' || steps.u.outputs.site == 'true' }}
      android: ${{ steps.p.outputs.android == 'true' || steps.u.outputs.android == 'true' }}
      ios: ${{ steps.p.outputs.ios == 'true' || steps.u.outputs.ios == 'true' }}
    env:
      HAS_PAT: ${{ secrets.WORKFLOW_PAT != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_PAT || github.token }}
          fetch-depth: 0
      - id: p
        name: What changed?
        env:
          WHAT: ${{ inputs.what }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          zip=""; site=""; android=""; ios=""
          shopt -s nullglob; zips=(incoming/*.zip)
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$WHAT" in
              all)     site=true; android=true; ios=true; [ ${#zips[@]} -gt 0 ] && zip=true ;;
              import)  zip=true ;;
              site)    site=true ;;
              android) android=true ;;
              ios)     ios=true ;;
            esac
          elif [[ "$MSG" == Import\ quickmessage-* ]]; then
            echo "This is the commit the import itself made: it was already built / uploaded in that run."
          else
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then changed=$(git ls-files); else changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" || git ls-files); fi
            echo "$changed" | grep -q '^incoming/.*\.zip$' && [ ${#zips[@]} -gt 0 ] && zip=true
            echo "$changed" | grep -q '^android/' && android=true
            echo "$changed" | grep -q '^ios/' && ios=true
            echo "$changed" | grep -qv -e '^android/' -e '^ios/' -e '^\.github/' -e '^README' -e '^incoming/' && site=true
          fi
          echo "zip=$zip" >> "$GITHUB_OUTPUT"; echo "site=$site" >> "$GITHUB_OUTPUT"; echo "android=$android" >> "$GITHUB_OUTPUT"; echo "ios=$ios" >> "$GITHUB_OUTPUT"
          echo "plan: zip=$zip site=$site android=$android ios=$ios"
      - id: u
        name: Unpack the newest zip and commit
        if: steps.p.outputs.zip == 'true'
        run: |
          set -e
          shopt -s nullglob
          zips=(incoming/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then echo "No zip in incoming/ - nothing to do."; exit 0; fi
          newest=$(printf '%s\n' "${zips[@]}" | sort -V | tail -n1)
          echo "Importing $newest"
          rm -rf "$RUNNER_TEMP/unz" && mkdir "$RUNNER_TEMP/unz"
          unzip -q "$newest" -d "$RUNNER_TEMP/unz"
          src="$RUNNER_TEMP/unz"
          # a zip made as one top-level folder: use what is inside it
          if [ ! -e "$src/index.html" ] && [ "$(ls -1 "$src" | wc -l)" -eq 1 ] && [ -d "$src/$(ls -1 "$src")" ]; then src="$src/$(ls -1 "$src")"; fi
          if [ ! -e "$src/index.html" ]; then echo "::error::The zip doesn't look like a QuickMessage project (no index.html)."; exit 1; fi
          excludes=(--exclude=/.git/ --exclude=/incoming/ --exclude='*.zip' --exclude=/secrets.php)       # secrets.php holds the Firebase private key: it is never committed
          if [ "$HAS_PAT" != "true" ]; then excludes+=(--exclude=/.github/); echo "::notice::No WORKFLOW_PAT secret: .github/ is left as it is."; fi
          # The zip is the whole project, so files that are not in it any more are deleted too (excluded paths above are never touched).
          rsync -a --delete "${excludes[@]}" "$src"/ ./
          rm -f incoming/*.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git diff --cached --name-only > "$RUNNER_TEMP/changed.txt"
          git commit -q -m "Import $(basename "$newest")"
          git push
          grep -q '^android/' "$RUNNER_TEMP/changed.txt" && echo "android=true" >> "$GITHUB_OUTPUT" || true
          grep -q '^ios/' "$RUNNER_TEMP/changed.txt" && echo "ios=true" >> "$GITHUB_OUTPUT" || true
          grep -qv -e '^android/' -e '^ios/' -e '^\.github/' -e '^README' "$RUNNER_TEMP/changed.txt" && echo "site=true" >> "$GITHUB_OUTPUT" || true

  # ------------------------------------------------------------------ website -> FTP (runs while the apps build)
  site:
    needs: prepare
    if: needs.prepare.outputs.site == 'true'
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' }}
      FTP_DIR_RAW: ${{ secrets.FTP_DIR }}
    steps:
      - name: No FTP secrets
        if: env.HAS_FTP != 'true'
        run: echo "::notice::FTP_SERVER / FTP_USERNAME / FTP_PASSWORD are not set, so nothing is uploaded."
      - uses: actions/checkout@v4
        if: env.HAS_FTP == 'true'
        with: { ref: "${{ github.ref_name }}" }
      - name: Server folder
        if: env.HAS_FTP == 'true'
        id: d
        run: d="${FTP_DIR_RAW:-./}"; case "$d" in */) ;; *) d="$d/";; esac; echo "dir=$d" >> "$GITHUB_OUTPUT"
      - name: Upload the website
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          port: ${{ secrets.FTP_PORT || '21' }}
          server-dir: ${{ steps.d.outputs.dir }}
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            android/**
            ios/**
            incoming/**
            **/*.zip
            README.md
            database.rules.json
            secrets.php

  # ------------------------------------------------------------------ Android APK
  android:
    needs: prepare
    if: needs.prepare.outputs.android == 'true'
    runs-on: ubuntu-latest
    env:
      HAS_KS: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - name: "Version number (1000 + run number, so it is above the old builds)"
        run: echo "QM_BUILD=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.14.3 }
      - name: Use your own signing key (optional secrets)
        if: env.HAS_KS == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/qm.jks"
          echo "QM_KEYSTORE=$RUNNER_TEMP/qm.jks" >> "$GITHUB_ENV"
          echo "QM_STORE_PASS=${{ secrets.ANDROID_STORE_PASS }}" >> "$GITHUB_ENV"
          echo "QM_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "QM_KEY_PASS=${{ secrets.ANDROID_KEY_PASS }}" >> "$GITHUB_ENV"
      # The runner image already ships the Android SDK (ANDROID_HOME) and accepts its licences; the gradle cache from setup-gradle speeds up later builds.
      - name: Build debug APK
        working-directory: android
        run: set -o pipefail; gradle assembleDebug --no-daemon --build-cache --stacktrace 2>&1 | tee build.log
      - name: Show compile errors in the job summary
        if: failure()
        run: |
          { echo '### Build errors'; echo '```'; grep -E '^e: |error:|FAILED|What went wrong' -A3 android/build.log | head -80; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: quickmessage-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
      - name: Upload the build log (only when it failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android/build.log

  # ------------------------------------------------------------------ iOS: unsigned .ipa + TrollStore .tipa
  ios:
    needs: prepare
    if: needs.prepare.outputs.ios == 'true'
    runs-on: macos-latest
    env:
      NAME: 1.0.${{ github.run_number }}
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - name: Tools and version number
        run: |
          echo "BUILD=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          brew install xcodegen ldid
      - name: Generate the Xcode project and build (unsigned)
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -project QuickMessage.xcodeproj -scheme QuickMessage \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=$BUILD MARKETING_VERSION=$NAME \
            build | tail -n 40
      - name: Package the .ipa and the .tipa (TrollStore)
        working-directory: ios
        run: |
          app_src=build/Build/Products/Release-iphoneos/QuickMessage.app
          rm -rf Payload && mkdir Payload && cp -R "$app_src" Payload/
          zip -qr QuickMessage-unsigned.ipa Payload
          # TrollStore: a .tipa is an .ipa whose binaries carry a fake signature (ldid) - TrollStore replaces it with its own permanent one.
          rm -rf tipa && mkdir -p tipa/Payload && cp -R "$app_src" tipa/Payload/
          app=tipa/Payload/QuickMessage.app
          for b in "$app"/PlugIns/*.appex; do [ -d "$b" ] && ldid -S "$b/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$b/Info.plist")"; done
          ldid -S "$app/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          (cd tipa && zip -qry ../QuickMessage.tipa Payload)
          ls -la QuickMessage-unsigned.ipa QuickMessage.tipa
      - uses: actions/upload-artifact@v4
        with:
          name: quickmessage-ios
          path: |
            ios/QuickMessage-unsigned.ipa
            ios/QuickMessage.tipa
          compression-level: 0

  # ------------------------------------------------------------------ iOS Simulator build (its own runner, so it doesn't make the device build wait)
  ios-sim:
    needs: prepare
    if: needs.prepare.outputs.ios == 'true'
    runs-on: macos-latest
    env:
      NAME: 1.0.${{ github.run_number }}
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - name: Build for the iOS Simulator
        working-directory: ios
        run: |
          BUILD=$((1000 + GITHUB_RUN_NUMBER))
          brew install xcodegen
          xcodegen generate
          # boot a simulator, then: xcrun simctl install booted QuickMessage.app && xcrun simctl launch booted app.quickmessage.chat
          xcodebuild -project QuickMessage.xcodeproj -scheme QuickMessage \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=$BUILD MARKETING_VERSION=$NAME \
            build | tail -n 40
          mkdir -p sim && cp -R build-sim/Build/Products/Debug-iphonesimulator/QuickMessage.app sim/
          ditto -c -k --keepParent sim/QuickMessage.app QuickMessage-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: quickmessage-ios-simulator
          path: ios/QuickMessage-simulator.zip
          compression-level: 0

  # ------------------------------------------------------------------ app files -> FTP (after the builds; the site upload, if any, is already done by then)
  publish:
    needs: [prepare, site, android, ios, ios-sim]
    if: always() && needs.prepare.result == 'success' && (needs.android.result == 'success' || needs.ios.result == 'success')
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' }}
      FTP_DIR_RAW: ${{ secrets.FTP_DIR }}
      RUN: ${{ github.run_number }}
    steps:
      - name: No FTP secrets
        if: env.HAS_FTP != 'true'
        run: echo "::notice::FTP_SERVER / FTP_USERNAME / FTP_PASSWORD are not set, so nothing is uploaded. The builds are in this run's artifacts."
      - name: Server folder
        if: env.HAS_FTP == 'true'
        id: d
        run: d="${FTP_DIR_RAW:-./}"; case "$d" in */) ;; *) d="$d/";; esac; echo "dir=$d" >> "$GITHUB_OUTPUT"
      - name: Get the builds
        if: env.HAS_FTP == 'true'
        uses: actions/download-artifact@v4
        with: { path: builds }
        continue-on-error: true
      - name: Version files
        if: env.HAS_FTP == 'true'
        run: |
          code=$((1000 + RUN)); name="1.0.$RUN"; built=$(date -u +%FT%TZ)
          htaccess='AddType application/vnd.android.package-archive .apk\nAddType application/octet-stream .ipa\nAddType application/octet-stream .tipa\n'
          mkdir -p dl-android dl-ios
          if [ "${{ needs.android.result }}" = "success" ] && [ -f builds/quickmessage-debug/app-debug.apk ]; then
            mv builds/quickmessage-debug/app-debug.apk dl-android/quickmessage.apk
            jq -n --argjson code "$code" --arg name "$name" --argjson size "$(stat -c%s dl-android/quickmessage.apk)" --arg built "$built" \
              '{versionCode:$code, versionName:$name, url:"downloads/quickmessage.apk", size:$size, built:$built}' > dl-android/android.json
            printf "$htaccess" > dl-android/.htaccess
            cat dl-android/android.json
          fi
          if [ "${{ needs.ios.result }}" = "success" ] && [ -d builds/quickmessage-ios ]; then
            mv builds/quickmessage-ios/* dl-ios/
            sim=""; if [ -f builds/quickmessage-ios-simulator/QuickMessage-simulator.zip ]; then mv builds/quickmessage-ios-simulator/QuickMessage-simulator.zip dl-ios/; sim="downloads/QuickMessage-simulator.zip"; fi
            jq -n --argjson code "$code" --arg name "$name" --arg built "$built" --arg sim "$sim" \
              '{versionCode:$code, versionName:$name, url:"downloads/QuickMessage-unsigned.ipa", tipa:"downloads/QuickMessage.tipa", built:$built} + (if $sim != "" then {simulator:$sim} else {} end)' > dl-ios/ios.json
            printf "$htaccess" > dl-ios/.htaccess
            ls -la dl-ios; cat dl-ios/ios.json
          fi
      - name: Upload the Android files
        if: env.HAS_FTP == 'true' && needs.android.result == 'success'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          port: ${{ secrets.FTP_PORT || '21' }}
          server-dir: ${{ steps.d.outputs.dir }}downloads/
          local-dir: dl-android/
          state-name: .ftp-state-android.json
      - name: Upload the iOS files
        if: env.HAS_FTP == 'true' && needs.ios.result == 'success'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          port: ${{ secrets.FTP_PORT || '21' }}
          server-dir: ${{ steps.d.outputs.dir }}downloads/
          local-dir: dl-ios/
          state-name: .ftp-state-ios.json
