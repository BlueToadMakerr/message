<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QuickMessage</title>
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'system'; } catch (e) {}</script>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <h1 class="brand"><span class="logo" data-icon="chat" data-size="18"></span> QuickMessage</h1>
    <div class="topbar-actions hidden" id="topActions">
      <button id="installBtn" class="btn small hidden" type="button"><span data-icon="download" data-size="16"></span> Install</button>
      <button id="toggleNotifBtn" class="icon-btn hidden" type="button" aria-label="Notifications" title="Notifications"></button>
      <a href="account.html" id="accountLink" class="icon-btn" aria-label="Account" title="Account"></a>
    </div>
  </header>

  <main>
    <div id="loading" class="center-note">Loading…</div>

    <!-- Logged out -->
    <section id="auth" class="card auth-card hidden">
      <div class="stack">
        <div>
          <h2>Welcome to QuickMessage</h2>
          <p class="muted" style="margin:.25rem 0 0">A simple, lightweight private chat. Log in or create an account to start.</p>
        </div>
        <button id="googleBtn" class="btn block" type="button">Continue with Google</button>
        <div class="divider">or</div>
        <form id="authForm" class="stack" novalidate>
          <div>
            <label class="lbl" for="email">Email</label>
            <input id="email" class="field" type="email" autocomplete="email" placeholder="you@example.com" required>
          </div>
          <div>
            <label class="lbl" for="password">Password</label>
            <input id="password" class="field" type="password" autocomplete="current-password" placeholder="At least 6 characters" required>
          </div>
          <div class="row">
            <button id="loginBtn" class="btn primary grow" type="submit">Log in</button>
            <button id="signupBtn" class="btn grow" type="button">Sign up</button>
          </div>
          <button id="forgotBtn" class="link-btn" type="button" style="align-self:center">Forgot password?</button>
        </form>
      </div>
    </section>

    <!-- Logged in -->
    <section id="app" class="hidden">
      <div id="chatList" class="chat-list" aria-live="polite"></div>
    </section>
  </main>

  <button id="newChatBtn" class="btn primary fab hidden" type="button"><span data-icon="plus" data-size="18"></span> New chat</button>
</div>

<dialog id="newChatDialog" class="modal">
  <form id="newChatForm" method="dialog">
    <div class="modal-head">
      <h2>Start a new chat</h2>
      <button type="button" class="icon-btn" id="ncClose" aria-label="Close" data-icon="close"></button>
    </div>
    <div>
      <label class="lbl" for="toUid">Recipient UID</label>
      <input id="toUid" class="field" placeholder="Paste their UID" autocomplete="off" spellcheck="false">
      <p class="hint" style="margin-top:.4rem">Ask them to copy it from their Account page.</p>
    </div>
    <div id="ncPreview" class="profile-preview hidden"></div>
    <p id="ncError" class="hint hidden" style="color:var(--danger)"></p>
    <div class="modal-actions">
      <button type="button" class="btn" id="ncCancel">Cancel</button>
      <button type="submit" class="btn primary" id="ncGo">Continue</button>
    </div>
  </form>
</dialog>

<script type="module" src="js/index.js"></script>
</body>
</html>
