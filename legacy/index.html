<html>
<head>

<title>QuickMessage (compatibility mode)</title>

a{color:#4f46e5}

#err{color:#b91c1c}
.note{font-size:14px;color:#555}

</head>

function setErr(t) { document.getElementById('err').innerHTML = esc(t || ''); }
function show(h) { document.getElementById('v').innerHTML = h; }
function stop() { if (timer) { clearTimeout(timer); timer = null; } }

function loginView() {
  stop(); chat = null;
  show('<div class="box"><b>Log in or create an account</b><br>Email<br><input id="em" type="text" autocapitalize="off"><br>Password<br><input id="pw" type="password"><br>' +
    '<button onclick="doAuth(\'login\')">Log in</button><button onclick="doAuth(\'signup\')">Sign up</button>' +
    '<div class="note">' + (mode === 'firebase' ? 'Firebase account (email + password; there is no Google sign-in here).' : 'Private server account.') + '</div></div>' +
    '<div class="box"><b>Server</b><br>' +
    '<label><input type="radio" name="md" id="md1"' + (mode === 'private' ? ' checked="checked"' : '') + '> Private server</label> ' +
    '<label><input type="radio" name="md" id="md2"' + (mode === 'firebase' ? ' checked="checked"' : '') + '> Firebase</label><br>' +
    'Private server address<br><input id="sv" type="text" autocapitalize="off" value="' + esc(server) + '"><div class="note">e.g. http://192.168.1.20:8080 (empty = the server this page came from)</div>' +
    'Firebase database address<br><input id="dbu" type="text" autocapitalize="off" value="' + esc(dbUrl) + '"><div class="note">e.g. https://your-project-default-rtdb.firebaseio.com (empty = the default database).</div>' +
    'Firebase connection<br><label><input type="radio" name="vi" id="vi1"' + (via === 'direct' ? ' checked="checked"' : '') + '> Direct</label> <label><input type="radio" name="vi" id="vi2"' + (via === 'proxy' ? ' checked="checked"' : '') + '> Through proxy.php</label>' +
    '<div class="note">Direct: this browser talks to Firebase itself, which puts no load on this website (needs a browser with modern HTTPS). Proxy: for very old browsers; used automatically if direct cannot connect.</div>' +
    '<button onclick="saveServer()">Save</button></div>');
}
function saveServer() {
  var d = cleanDb(document.getElementById('dbu').value);
  if (d === null) { setErr('That is not a Firebase database address (it should look like https://name-default-rtdb.firebaseio.com).'); return; }
  server = cleanUrl(document.getElementById('sv').value); dbUrl = d;
  mode = document.getElementById('md2').checked ? 'firebase' : 'private'; via = document.getElementById('vi2').checked ? 'proxy' : 'direct';
  try { localStorage.setItem('qm-lmode', mode); localStorage.setItem('qm-lserver', server); localStorage.setItem('qm-ldb', dbUrl); localStorage.setItem('qm-lvia', via); } catch (e) {}
  clearSession(); chatsCache = null; setErr('Saved. Now using ' + (mode === 'firebase' ? 'Firebase' + (via === 'proxy' ? ' through proxy.php' : ' directly') + (dbUrl ? ' (' + dbUrl + ')' : ' (default database)') : 'the private server at ' + base()) + '.'); loginView();
}
function doAuth(kind) {
  setErr('');
  var b = { email: document.getElementById('em').value, password: document.getElementById('pw').value };
  api('auth/' + kind, b, function (st, j) {
    if (st === 0 && mode === 'firebase' && via === 'direct') {          // this browser can't reach Google: use the proxy from now on (it tries again with it right away)
      via = 'proxy'; try { localStorage.setItem('qm-lvia', 'proxy'); } catch (e0) {}
      setErr('This browser could not reach Google directly, so it now uses proxy.php.');
      api('auth/' + kind, b, function (st2, j2) { if (st2 !== 200) { setErr(j2.error || 'Could not log in.'); return; } token = j2.token; try { localStorage.setItem('qm-ltoken', token); } catch (e1) {} listView(); });
      return;
    }
    if (st !== 200) { setErr(j.error || 'Could not log in.'); return; }
    if (!(mode === 'firebase' && via === 'direct')) { token = j.token; try { localStorage.setItem('qm-ltoken', token); } catch (e) {} }
    listView();
  });
}
function logout() { clearSession(); chatsCache = null; loginView(); }

var more = false, seen = {}, firstKey = '', sendN = 0, cdT = {}, polling = false;
function near() { try { var d = document.documentElement, b = document.body; return (window.pageYOffset || d.scrollTop || 0) + (window.innerHeight || d.clientHeight || 0) >= Math.max(d.scrollHeight, b.scrollHeight) - 120; } catch (e) { return true; } }
function bottom() { try { window.scrollTo(0, 999999); } catch (e) {} }
/** Disables a button for N seconds (shows the countdown), so the refresh buttons can't be spammed. */
function cool(id, label, secs) {
  var b = document.getElementById(id); if (!b) return;
  if (cdT[id]) clearInterval(cdT[id]);
  var left = secs; b.disabled = true; b.innerHTML = label + ' (' + left + ')';
  cdT[id] = setInterval(function () {
    var bb = document.getElementById(id); left--;
    if (!bb) { clearInterval(cdT[id]); return; }
    if (left <= 0) { clearInterval(cdT[id]); cdT[id] = null; bb.disabled = false; bb.innerHTML = label; } else bb.innerHTML = label + ' (' + left + ')';
  }, 1000);
}

var chatsCache = null, openedAt = {};
try { openedAt = parse(localStorage.getItem('qm-lopen') || '{}') || {}; } catch (e) {}
function markOpened(id) { openedAt[id] = (new Date()).getTime(); try { localStorage.setItem('qm-lopen', str(openedAt)); } catch (e) {} }
/** Order: chats with a message from someone else that is newer than your last visit come first (newest first); the rest follow, the most recently opened first. */
function isNew(c) { return !c.mine && c.ts > (openedAt[c.id] || 0); }
function byOrder(a, b) {
  var na = isNew(a), nb = isNew(b);
  if (na !== nb) return na ? -1 : 1;
  if (na) return b.ts - a.ts;
  return ((openedAt[b.id] || 0) - (openedAt[a.id] || 0)) || (b.ts - a.ts);
}
/** The chat list is fetched once and kept: going back from a chat only redraws it from memory. Only "Reload chats" (or reloading the page) fetches it again. */
function listView(force) {
  stop(); chat = null; setErr('');
  if (chatsCache && force !== true) { drawList(); return; }
  show('<div class="box">Loading your chats...</div>');
  api('lite/chats', null, function (st, j) {
    if (st !== 200) { setErr(j.error || 'Could not load chats.'); show('<div class="box"><button onclick="listView(true)">Try again</button> <button onclick="logout()">Log out</button></div>'); return; }
    chatsCache = j; drawList();
  });
}
function drawList() {
  var j = chatsCache; me = j.me; j.chats.sort(byOrder);
  var h = '<div class="box">Signed in as <b>' + esc(j.me) + '</b> &nbsp; <button class="sm" onclick="logout()">Log out</button> <button class="sm" id="rl" onclick="listView(true)">Reload chats</button></div>';
  h += '<div class="box"><b>New chat</b><br><input id="ne" type="text" autocapitalize="off" value="" > <button onclick="newChat()">Start</button><div class="note">Type the other person\'s account email.</div></div>';
  var i, c; h += '<div class="box">';
  if (!j.chats.length) h += 'No chats yet.';
  for (i = 0; i < j.chats.length; i++) {
    c = j.chats[i];
    h += '<div class="row" onclick="openChat(\'' + c.id + '\',\'' + esc(c.name).replace(/'/g, '') + '\')"><b>' + esc(c.name) + (c.enc ? ' (encrypted)' : '') + (isNew(c) ? ' <span class="act">- new messages</span>' : '') + '</b></div>';
  }
  h += '<div class="note">The chat list is loaded once and kept. Use "Reload chats" to update it.</div></div>';
  show(h);
}
function newChat() {
  var e = document.getElementById('ne').value;
  if (!e) return;
  setErr('Creating the chat...');
  api('lite/newchat', { email: e }, function (st, j) { if (st !== 200) { setErr(j.error || 'Could not start the chat.'); return; } setErr(''); listView(true); });
}
function msgHtml(m) {
  var act = m.me ? '<div class="act" id="a_' + m.key + '"><a onclick="askDel(\'' + m.key + '\')">Delete</a></div>' : '';
  return '<div class="msg' + (m.me ? ' me' : '') + '" id="m_' + m.key + '"><div class="who">' + esc(m.me ? 'You' : m.name) + '</div><span id="t_' + m.key + '">' + esc(m.text).replace(/\n/g, '<br>') + '</span>' + act + '</div>';
}
function openChat(id, name) {
  markOpened(id); stop(); chat = id; chatName = name; lastKey = ''; firstKey = ''; seen = {}; more = false; setErr('');
  show('<div class="box"><button class="sm" onclick="listView(false)">&laquo; Chats</button> <b>' + esc(name) + '</b> &nbsp; <button class="sm" id="rf" onclick="manualRefresh()">Refresh</button>' +
    '<div class="note">Updates by itself every 10 seconds.</div></div><div id="older"></div><div id="ms"><div class="note">Loading messages...</div></div>' +
    '<div class="box"><textarea id="tx" rows="2"></textarea><br><button id="sb" onclick="send()">Send</button><span class="note"> Text only. Encrypted chats can\'t be read here.</span></div>');
  poll(true);
}
function olderBtn() {
  var o = document.getElementById('older'); if (!o) return;
  o.innerHTML = more ? '<div class="box"><button id="ob" onclick="loadOlder()">Load older messages</button></div>' : '';
}
function manualRefresh() { cool('rf', 'Refresh', 5); stop(); poll(false); }
function poll(first) {
  if (!chat || polling) return;
  if (!first && document.hidden === true) { stop(); timer = setTimeout(function () { poll(false); }, 10000); return; }      // nobody is looking: don't download anything
  polling = true; var id = chat;
  api('lite/messages?chat=' + encodeURIComponent(id) + '&after=' + encodeURIComponent(lastKey), null, function (st, j) {
    polling = false;
    if (chat !== id) return;
    var box = document.getElementById('ms');
    if (st === 200 && j.messages) {
      var i, m, h = '', stick = near() || first;
      for (i = 0; i < j.messages.length; i++) {
        m = j.messages[i]; if (m.key > lastKey) lastKey = m.key;
        if (seen[m.key]) continue;
        seen[m.key] = 1; if (!firstKey || m.key < firstKey) firstKey = m.key; h += msgHtml(m);
      }
      if (first) { box.innerHTML = h || '<div class="note" id="nomsg">No messages yet.</div>'; more = !!j.more; olderBtn(); }
      else if (h && box) { var n = document.getElementById('nomsg'); if (n) n.parentNode.removeChild(n); box.innerHTML = box.innerHTML + h; }
      if (h && stick) bottom();
      setErr('');
    } else if (st !== 200) setErr(j.error || 'Could not load messages. Will try again.');
    stop(); timer = setTimeout(function () { poll(false); }, 10000);
  });
}
function loadOlder() {
  if (!chat || !firstKey) return;
  var id = chat, b = document.getElementById('ob'); if (b) { b.disabled = true; b.innerHTML = 'Loading...'; }
  api('lite/messages?chat=' + encodeURIComponent(id) + '&before=' + encodeURIComponent(firstKey), null, function (st, j) {
    if (chat !== id) return;
    if (st !== 200) { setErr(j.error || 'Could not load older messages.'); if (b) { b.disabled = false; b.innerHTML = 'Load older messages'; } return; }
    var i, m, h = '', box = document.getElementById('ms'), y = 0, h0 = 0;
    try { y = window.pageYOffset || document.documentElement.scrollTop || 0; h0 = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight); } catch (e) {}
    for (i = 0; i < j.messages.length; i++) { m = j.messages[i]; if (seen[m.key]) continue; seen[m.key] = 1; if (m.key < firstKey) firstKey = m.key; h += msgHtml(m); }
    box.innerHTML = h + box.innerHTML; more = !!j.more; olderBtn(); setErr('');
    try { window.scrollTo(0, y + Math.max(document.documentElement.scrollHeight, document.body.scrollHeight) - h0); } catch (e2) {}
  });
}
/** Sending: the message shows up at once as "sending..." (grey) and turns normal when the server has it. */
function send() {
  var t = document.getElementById('tx'), v = t.value;
  if (!v || !chat) return;
  t.value = ''; doSend('p' + (++sendN), v, false);
}
function doSend(pid, v, retry) {
  var box = document.getElementById('ms'), id = chat, el = document.getElementById('m_' + pid);
  if (!el) { var d = document.createElement('div'); d.innerHTML = '<div class="msg me pending" id="m_' + pid + '"><div class="who">You</div><span id="t_' + pid + '">' + esc(v).replace(/\n/g, '<br>') + '</span><div class="act" id="a_' + pid + '"></div></div>'; box.appendChild(d.firstChild); el = document.getElementById('m_' + pid); }
  el.className = 'msg me pending'; document.getElementById('a_' + pid).innerHTML = 'sending...';
  bottom();
  api('lite/send', { chat: id, text: v }, function (st, j) {
    el = document.getElementById('m_' + pid); if (!el) return;
    if (st === 200 && j.ok && j.key) {
      seen[j.key] = 1; if (!firstKey || j.key < firstKey) firstKey = j.key;
      el.id = 'm_' + j.key; document.getElementById('t_' + pid).id = 't_' + j.key; el.className = 'msg me';
      var a = document.getElementById('a_' + pid); a.id = 'a_' + j.key; a.innerHTML = '<a onclick="askDel(\'' + j.key + '\')">Delete</a>';
    } else {
      el.className = 'msg me failed'; var q = v.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n');
      document.getElementById('a_' + pid).innerHTML = 'Not sent' + (j && j.error ? ' (' + esc(j.error) + ')' : (st === 200 ? ' (encrypted chat?)' : '')) + '. <a onclick="doSend(\'' + pid + '\',\'' + q + '\',true)">Try again</a> &nbsp; <a onclick="var e=document.getElementById(\'m_' + pid + '\');e.parentNode.removeChild(e)">Remove</a>';
    }
  });
}
/** Deleting: first the message turns red and asks, then orange while it is being deleted, then it disappears. */
function askDel(key) {
  var el = document.getElementById('m_' + key), a = document.getElementById('a_' + key); if (!el) return;
  el.className = 'msg me askdel';
  var box = a;
  if (box) box.innerHTML = 'Delete this message? <a onclick="doDel(\'' + key + '\')"><b>Yes, delete</b></a> &nbsp; <a onclick="cancelDel(\'' + key + '\')">Cancel</a>';
}
function cancelDel(key) {
  var el = document.getElementById('m_' + key); if (!el) return;
  el.className = 'msg me'; var box = document.getElementById('a_' + key); if (box) box.innerHTML = '<a onclick="askDel(\'' + key + '\')">Delete</a>';
}
function doDel(key) {
  var el = document.getElementById('m_' + key), id = chat; if (!el) return;
  el.className = 'msg me deleting'; var box = document.getElementById('a_' + key); if (box) box.innerHTML = 'Deleting...';
  api('lite/delete', { chat: id, key: key }, function (st, j) {
    el = document.getElementById('m_' + key); if (!el) return;
    if (st === 200 && j.ok) { el.parentNode.removeChild(el); }
    else { setErr((j && j.error) || 'Could not delete the message.'); cancelDel(key); }
  });
}
function start() { if (token) listView(false); else loginView(); }
if (mode) start();
else {      // first visit: a QuickMessage Python server answers /api/ping; the Firebase website does not
  mode = 'private';
  api('ping', null, function (st, j) { if (!(j && j.server === 'quickmessage-private')) mode = 'firebase'; try { localStorage.setItem('qm-lmode', mode); } catch (e) {} start(); });
}
</script>
